name: Build firmwares

on:
  workflow_dispatch:
    inputs:
      manifest_glob:
        description: "Manifest glob"
        required: false
      debug:
        type: boolean
        description: "Output build data to artifacts"
        required: false
  release:
    types:
      - published

env:
  BUILDER_IMAGE_NAME: silabs-firmware-builder
  BUILDER_IMAGE_ARTIFACT: firmware-builder-image

jobs:
  run-pre-commit:
    name: Run pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0

      - name: Install pre-commit
        run: |
          pip install pre-commit
          pre-commit install

      - name: Run pre-commit
        run: |
          pre-commit run --show-diff-on-failure --color=always --all-files

  build-container:
    name: Build container
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h

      - name: Build container image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          tags: ${{ env.BUILDER_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ github.workflow }}
          cache-to: type=gha,scope=${{ github.workflow }},mode=max
          outputs: type=docker,dest=/tmp/firmware-builder.tar

      - name: Upload container image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.BUILDER_IMAGE_ARTIFACT }}
          path: /tmp/firmware-builder.tar
          compression-level: 0
          if-no-files-found: error

  list-manifests:
    name: List firmware manifests
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: set-matrix
        run: |
          echo "matrix=$(find manifests -type f \( -name "${{ inputs.manifest_glob || '*' }}.yaml" -o -name "${{ inputs.manifest_glob || '*' }}.yml" \) -print | sort | jq -R -s -c 'split("\n")[:-1]')" >> $GITHUB_OUTPUT

  build-firmwares:
    name: Firmware builder
    needs: [list-manifests, build-container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        manifest: ${{ fromJson(needs.list-manifests.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download container image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.BUILDER_IMAGE_ARTIFACT }}
          path: /tmp/firmware-builder-image

      - name: Build firmware
        id: build-firmware
        run: |
          image_name="${{ env.BUILDER_IMAGE_NAME }}:${{ github.sha }}"
          repo_hash=$(git rev-parse --short=8 "$GITHUB_SHA")

          rm -rf build outputs
          mkdir -p build outputs

          docker load --input /tmp/firmware-builder-image/firmware-builder.tar

          docker run --rm \
            --workdir /repo \
            --volume "$GITHUB_WORKSPACE:/repo" \
            --env GITHUB_REPOSITORY_OWNER \
            "$image_name" \
            --manifest "${{ matrix.manifest }}" \
            --build-dir build \
            --output-dir outputs \
            --output gbl \
            --output hex \
            --output out \
            --repo-owner "$GITHUB_REPOSITORY_OWNER" \
            --repo-hash "$repo_hash"

          # Get the basename of the GBL in `outputs`
          output_basename=$(basename -- $(basename -- $(ls -1 outputs/*.gbl | head -n 1)) .gbl)
          echo "output_basename=$output_basename" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ inputs.debug }}
        with:
          name: build_dir_${{ steps.build-firmware.outputs.output_basename }}
          path: build/*
          compression-level: 9
          include-hidden-files: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firmware-build-${{ steps.build-firmware.outputs.output_basename }}
          path: outputs/*
          compression-level: 9
          if-no-files-found: error

  release-assets:
    name: Upload release assets
    needs: [build-firmwares]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all workflow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
          pattern: firmware-build-*

      - name: Upload artifacts
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: artifacts/*.gbl
